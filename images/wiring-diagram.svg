<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <title>Dual-Controller Ambilight with Automatic LED DATA Switching</title>
  <desc>Wiring schematic showing LG TV USB powering the SCORPIO, WLED and SCORPIO DATA inputs switching through a Power Relay FeatherWing, common ground, and external 5V LED power.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#111}
      .subtitle{font:16px Arial,sans-serif;fill:#444}
      .box{fill:#fff;stroke:#333;stroke-width:2.5;rx:12}
      .smallbox{fill:#fafafa;stroke:#555;stroke-width:2;rx:10}
      .label{font:700 17px Arial,sans-serif;fill:#111}
      .text{font:15px Arial,sans-serif;fill:#222}
      .small{font:13px Arial,sans-serif;fill:#333}
      .signal{fill:none;stroke:#222;stroke-width:3;marker-end:url(#arrow)}
      .power{fill:none;stroke:#222;stroke-width:3}
      .ground{fill:none;stroke:#555;stroke-width:2.5}
      .dash{fill:none;stroke:#777;stroke-width:2;stroke-dasharray:8 7}
      .warning{fill:#fff;stroke:#333;stroke-width:2.5;rx:10}
      .contact{fill:#fff;stroke:#222;stroke-width:2}
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#fff"/>
  <text x="800" y="45" text-anchor="middle" class="title">Dual-Controller Ambilight with Automatic LED DATA Switching</text>
  <text x="800" y="72" text-anchor="middle" class="subtitle">SCORPIO + HyperSerialPico ↔ WLED • DATA-only relay switching • SK6812 RGBW</text>

  <!-- LG TV -->
  <rect x="60" y="125" width="250" height="125" class="box"/>
  <text x="185" y="160" text-anchor="middle" class="label">LG TV</text>
  <text x="185" y="188" text-anchor="middle" class="text">USB power output</text>
  <text x="185" y="215" text-anchor="middle" class="small">Selected port must turn OFF with TV</text>

  <!-- SCORPIO -->
  <rect x="380" y="105" width="370" height="250" class="box"/>
  <text x="565" y="140" text-anchor="middle" class="label">Adafruit Feather RP2040 SCORPIO</text>
  <text x="405" y="180" class="text">GPIO16 / OUT0 / NEOPIXEL0</text>
  <text x="405" y="203" class="small">HyperSerialPico LED DATA</text>
  <text x="405" y="250" class="text">GPIO9 / D9</text>
  <text x="405" y="273" class="small">Relay control (HIGH = energized)</text>
  <text x="405" y="320" class="text">GND</text>
  <text x="600" y="320" class="small">Common ground</text>

  <!-- USB power -->
  <path d="M310 185 H380" class="power"/>
  <text x="345" y="175" text-anchor="middle" class="small">USB +5V</text>
  <text x="345" y="207" text-anchor="middle" class="small">SCORPIO only</text>

  <!-- Relay -->
  <rect x="850" y="105" width="340" height="310" class="box"/>
  <text x="1020" y="140" text-anchor="middle" class="label">Power Relay FeatherWing</text>
  <text x="1020" y="163" text-anchor="middle" class="small">Control jumper: D9 / GPIO9</text>

  <rect x="915" y="195" width="75" height="55" class="contact"/>
  <text x="952" y="228" text-anchor="middle" class="label">NC</text>
  <rect x="915" y="285" width="75" height="55" class="contact"/>
  <text x="952" y="318" text-anchor="middle" class="label">NO</text>
  <rect x="1050" y="240" width="80" height="55" class="contact"/>
  <text x="1090" y="273" text-anchor="middle" class="label">COM</text>
  <circle cx="1020" cy="267" r="9" fill="#fff" stroke="#222" stroke-width="2"/>
  <path d="M1020 267 L1090 267" stroke="#222" stroke-width="3"/>
  <path d="M1020 267 L952 222" stroke="#222" stroke-width="3"/>
  <text x="1020" y="375" text-anchor="middle" class="small">~100 mA @ 3.3V when energized</text>

  <!-- SCORPIO DATA to NO -->
  <path d="M750 180 H820 V312 H915" class="signal"/>
  <text x="815" y="170" text-anchor="middle" class="small">LED DATA</text>

  <!-- GPIO9 relay control -->
  <path d="M750 250 H800 V355 H850" class="signal"/>
  <text x="802" y="343" text-anchor="middle" class="small">RELAY CONTROL</text>

  <!-- WLED -->
  <rect x="60" y="410" width="330" height="185" class="box"/>
  <text x="225" y="448" text-anchor="middle" class="label">ESP32 / WLED Controller</text>
  <text x="225" y="485" text-anchor="middle" class="text">DATA OUT</text>
  <text x="225" y="515" text-anchor="middle" class="text">GND</text>
  <text x="225" y="545" text-anchor="middle" class="text">+5V* from external PSU</text>
  <text x="225" y="574" text-anchor="middle" class="small">* only where supported by the controller</text>

  <!-- WLED data to NC -->
  <path d="M390 485 H700 V222 H915" class="signal"/>
  <text x="560" y="475" text-anchor="middle" class="small">WLED DATA OUT</text>

  <!-- COM to resistor and LED -->
  <path d="M1130 267 H1260" class="signal"/>
  <text x="1195" y="255" text-anchor="middle" class="small">Switched DATA</text>
  <rect x="1260" y="245" width="90" height="44" class="contact"/>
  <text x="1305" y="273" text-anchor="middle" class="label">330 Ω</text>
  <path d="M1350 267 H1420" class="signal"/>

  <!-- LED strip -->
  <rect x="1420" y="175" width="145" height="250" class="box"/>
  <text x="1492" y="212" text-anchor="middle" class="label">SK6812</text>
  <text x="1492" y="237" text-anchor="middle" class="label">RGBW LED Strip</text>
  <text x="1438" y="285" class="text">DIN ◄ DATA</text>
  <text x="1438" y="330" class="text">+5V</text>
  <text x="1438" y="375" class="text">GND</text>
  <text x="1492" y="405" text-anchor="middle" class="small">330 Ω close to DIN</text>

  <!-- PSU -->
  <rect x="650" y="650" width="300" height="165" class="box"/>
  <text x="800" y="690" text-anchor="middle" class="label">External 5 V PSU</text>
  <text x="690" y="735" class="text">+5 V</text>
  <text x="690" y="785" class="text">GND</text>

  <!-- PSU to LED power -->
  <path d="M950 735 H1180 V330 H1420" class="power"/>
  <text x="1150" y="720" text-anchor="middle" class="small">LED power — NOT switched</text>

  <!-- PSU to WLED power -->
  <path d="M650 735 H520 V545 H390" class="power"/>
  <text x="520" y="650" text-anchor="middle" class="small">+5V*</text>

  <!-- Ground bus -->
  <path d="M950 785 H1100 V375 H1420" class="ground"/>
  <path d="M650 785 H500 V515 H390" class="ground"/>
  <path d="M500 785 H565 V320 H565" class="ground"/>
  <text x="1070" y="805" text-anchor="middle" class="small">COMMON GND</text>
  <text x="515" y="805" text-anchor="middle" class="small">Common reference for DATA</text>

  <!-- Warning -->
  <rect x="60" y="690" width="510" height="145" class="warning"/>
  <text x="315" y="725" text-anchor="middle" class="label">⚠ DO NOT CONNECT THE TWO +5V SUPPLIES</text>
  <text x="85" y="760" class="text">LG TV USB +5V → SCORPIO only</text>
  <text x="85" y="790" class="text">External PSU +5V → LEDs and WLED*</text>
  <text x="85" y="820" class="small">GND is shared; +5V sources remain electrically separate.</text>

  <!-- State inset -->
  <rect x="60" y="875" width="1505" height="125" class="smallbox"/>
  <text x="812" y="905" text-anchor="middle" class="label">Automatic Switching Logic</text>
  <text x="100" y="945" class="text">TV OFF</text>
  <text x="205" y="945" class="small">→ SCORPIO off → GPIO9 inactive → NC → COM → WLED controls LEDs</text>
  <text x="100" y="975" class="text">TV ON</text>
  <text x="205" y="975" class="small">→ SCORPIO on → GPIO9 HIGH → NO → COM → HyperSerialPico controls LEDs</text>

  <!-- Notes -->
  <text x="1570" y="1025" text-anchor="end" class="small">DATA only is switched • LED power remains permanently connected • Do not use for mains switching</text>
</svg>
